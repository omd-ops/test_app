<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Snake Game</title>
  <style>
    :root{
      --bg:#0f1724;
      --panel:#0b1220;
      --accent:#10b981;
      --muted:#94a3b8;
      --danger:#ef4444;
      --glass: rgba(255,255,255,0.03);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;
      background:linear-gradient(180deg,var(--bg),#071221);
      color:#e6eef8;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      gap:20px;
    }

    .container{
      display:flex;
      gap:20px;
      align-items:flex-start;
      width:100%;
      max-width:980px;
    }

    .card{
      background:linear-gradient(180deg,var(--panel),#071026);
      padding:16px;
      border-radius:12px;
      box-shadow:0 8px 30px rgba(2,6,23,0.6);
    }

    .left{
      flex:1 1 620px;
      display:flex;
      flex-direction:column;
      gap:12px;
      align-items:center;
    }

    canvas{
      background:linear-gradient(180deg,#061424,#071b2a);
      border-radius:8px;
      image-rendering:pixelated;
      box-shadow: 0 6px 18px rgba(3,10,20,0.6), inset 0 1px 0 rgba(255,255,255,0.02);
    }

    .controls{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      justify-content:center;
      margin-top:6px;
    }

    button{
      background:var(--glass);
      border:1px solid rgba(255,255,255,0.03);
      color:var(--muted);
      padding:8px 12px;
      border-radius:8px;
      cursor:pointer;
      font-weight:600;
      transition:all .12s;
    }
    button:hover{ transform:translateY(-2px); color:var(--accent) }

    .stats{
      min-width:200px;
      display:flex;
      flex-direction:column;
      gap:10px;
      padding:12px;
      border-radius:10px;
      background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
    }
    .stat-line{ display:flex; justify-content:space-between; align-items:center; gap:12px; color:var(--muted) }
    .stat-line .value{ color:var(--accent); font-weight:700 }

    h1{ margin:0 0 6px 0; font-size:18px; color:#dff6ea }
    p.small{ margin:0; font-size:13px; color:var(--muted) }

    .footer-note{ font-size:12px; color:var(--muted); margin-top:8px; text-align:center }
    .kbd{ display:inline-block; padding:4px 8px; border-radius:6px; background:rgba(255,255,255,0.03); color:#cfeee3; border:1px solid rgba(255,255,255,0.02); font-weight:600; margin-left:6px }
    @media (max-width:820px){
      .container{ flex-direction:column; align-items:center }
      .left{ width:100% }
      canvas{ width:100%; height:auto }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card left">
      <h1>Snake</h1>
      <p class="small">Use arrow keys or WASD to move. Eat food to grow. Don't hit the walls or yourself.</p>

      <canvas id="game" width="480" height="480"></canvas>

      <div class="controls">
        <button id="startBtn">Start</button>
        <button id="pauseBtn">Pause</button>
        <button id="resetBtn">Reset</button>
        <button id="speedDown">- Speed</button>
        <button id="speedUp">+ Speed</button>
      </div>

      <div class="footer-note">
        Controls: <span class="kbd">← ↑ → ↓</span> or <span class="kbd">A W D S</span>
      </div>
    </div>

    <div class="card stats" style="width:260px">
      <div>
        <div style="display:flex;justify-content:space-between;align-items:flex-end">
          <div>
            <div style="font-size:14px;color:var(--muted)">Score</div>
            <div style="font-size:30px;color:var(--accent);font-weight:800" id="score">0</div>
          </div>
          <div>
            <div style="font-size:14px;color:var(--muted)">High Score</div>
            <div style="font-size:20px;color:#ffd47a;font-weight:800" id="highscore">0</div>
          </div>
        </div>
      </div>

      <div class="stat-line"><div>Grid</div><div class="value" id="gridSize">20 × 20</div></div>
      <div class="stat-line"><div>Speed</div><div class="value" id="speedValue">6</div></div>
      <div class="stat-line"><div>Length</div><div class="value" id="length">1</div></div>
      <div class="stat-line"><div>Status</div><div class="value" id="status">Idle</div></div>

      <div style="margin-top:8px;font-size:13px;color:var(--muted)">
        Tips: Pause with the Pause button. Speed affects game tick rate.
      </div>
    </div>
  </div>

  <script>
    // Basic snake game on canvas
    (function(){
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');

      const scoreEl = document.getElementById('score');
      const highEl = document.getElementById('highscore');
      const gridSizeEl = document.getElementById('gridSize');
      const speedValueEl = document.getElementById('speedValue');
      const lengthEl = document.getElementById('length');
      const statusEl = document.getElementById('status');

      const startBtn = document.getElementById('startBtn');
      const pauseBtn = document.getElementById('pauseBtn');
      const resetBtn = document.getElementById('resetBtn');
      const speedUp = document.getElementById('speedUp');
      const speedDown = document.getElementById('speedDown');

      // configurable
      const COLS = 20;
      const ROWS = 20;
      gridSizeEl.textContent = `${COLS} × ${ROWS}`;

      let tile = Math.floor(canvas.width / COLS);
      let speed = 6; // ticks per second
      speedValueEl.textContent = speed;

      // game state
      let snake = [{x: Math.floor(COLS/2), y: Math.floor(ROWS/2)}]; // head first
      let dir = {x:1, y:0}; // moving right initially when started
      let nextDir = {...dir};
      let food = null;
      let score = 0;
      let highscore = Number(localStorage.getItem('snake_high') || 0);
      highEl.textContent = highscore;
      let running = false;
      let paused = false;
      let tickId = null;
      let tickInterval = 1000 / speed;

      // helper: place food not on snake
      function placeFood(){
        const taken = new Set(snake.map(s => `${s.x},${s.y}`));
        let tries = 0;
        while(tries < 500){
          const fx = Math.floor(Math.random()*COLS);
          const fy = Math.floor(Math.random()*ROWS);
          if(!taken.has(`${fx},${fy}`)){
            food = {x:fx, y:fy};
            return;
          }
          tries++;
        }
        // fallback: if board full, game won (rare)
        food = null;
      }

      function resetGame(){
        snake = [{x: Math.floor(COLS/2), y: Math.floor(ROWS/2)}];
        dir = {x:0,y:0};
        nextDir = {...dir};
        score = 0;
        placeFood();
        running = false;
        paused = false;
        updateUI();
        draw();
      }

      function updateUI(){
        scoreEl.textContent = score;
        highEl.textContent = highscore;
        speedValueEl.textContent = speed;
        lengthEl.textContent = snake.length;
        statusEl.textContent = running ? (paused ? 'Paused' : 'Running') : 'Idle';
      }

      function drawCell(x,y,fillStyle,stroke=false){
        const px = x*tile;
        const py = y*tile;
        ctx.fillStyle = fillStyle;
        roundRect(ctx, px+1, py+1, tile-2, tile-2, 6, true, false);
        if(stroke){
          ctx.strokeStyle = 'rgba(0,0,0,0.2)';
          ctx.stroke();
        }
      }

      // Rounded rect helper
      function roundRect(ctx, x, y, width, height, radius, fill, stroke) {
        if (typeof radius === 'undefined') radius = 5;
        if (typeof radius === 'number') radius = {tl: radius, tr: radius, br: radius, bl: radius};
        ctx.beginPath();
        ctx.moveTo(x + radius.tl, y);
        ctx.lineTo(x + width - radius.tr, y);
        ctx.quadraticCurveTo(x + width, y, x + width, y + radius.tr);
        ctx.lineTo(x + width, y + height - radius.br);
        ctx.quadraticCurveTo(x + width, y + height, x + width - radius.br, y + height);
        ctx.lineTo(x + radius.bl, y + height);
        ctx.quadraticCurveTo(x, y + height, x, y + height - radius.bl);
        ctx.lineTo(x, y + radius.tl);
        ctx.quadraticCurveTo(x, y, x + radius.tl, y);
        ctx.closePath();
        if (fill) ctx.fill();
        if (stroke) ctx.stroke();
      }

      function draw(){
        // clear
        ctx.clearRect(0,0,canvas.width,canvas.height);

        // draw grid subtle
        ctx.save();
        ctx.globalAlpha = 0.05;
        ctx.fillStyle = '#ffffff';
        for(let i=0;i<COLS;i++){
          for(let j=0;j<ROWS;j++){
            if((i+j)%2===0){
              ctx.fillRect(i*tile, j*tile, tile, tile);
            }
          }
        }
        ctx.restore();

        // draw food
        if(food){
          drawCell(food.x, food.y, '#ffb86b');
        }

        // draw snake
        for(let i=snake.length-1;i>=0;i--){
          const s = snake[i];
          if(i === 0){
            // head
            drawCell(s.x, s.y, '#34d399');
          } else {
            drawCell(s.x, s.y, '#0ea5a6');
          }
        }

        // border
        ctx.lineWidth = 2;
        ctx.strokeStyle = 'rgba(255,255,255,0.04)';
        ctx.strokeRect(0,0,canvas.width,canvas.height);
      }

      function tick(){
        if(!running || paused) return;
        // apply direction
        dir = {...nextDir};
        if(dir.x === 0 && dir.y === 0) {
          // stationary until user hits a key
          draw(); return;
        }

        const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

        // collision: walls
        if(head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS){
          gameOver();
          return;
        }

        // collision: self
        for(const seg of snake){
          if(seg.x === head.x && seg.y === head.y){
            gameOver();
            return;
          }
        }

        // move
        snake.unshift(head); // add new head

        // food?
        if(food && head.x === food.x && head.y === food.y){
          score += 10;
          placeFood();
          if(score > highscore){
            highscore = score;
            localStorage.setItem('snake_high', String(highscore));
          }
        } else {
          // remove tail
          snake.pop();
        }

        updateUI();
        draw();
      }

      function gameOver(){
        running = false;
        paused = false;
        statusEl.textContent = 'Game Over';
        updateUI();
        // flash effect
        ctx.save();
        ctx.fillStyle = 'rgba(239,68,68,0.08)';
        ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.restore();
      }

      // Input handling
      const keyMap = {
        ArrowUp:    {x:0,y:-1},
        ArrowDown:  {x:0,y:1},
        ArrowLeft:  {x:-1,y:0},
        ArrowRight: {x:1,y:0},
        w: {x:0,y:-1},
        s: {x:0,y:1},
        a: {x:-1,y:0},
        d: {x:1,y:0}
      };

      window.addEventListener('keydown', (e) => {
        const k = e.key;
        if(k === ' '){
          // space toggles pause
          togglePause();
          e.preventDefault();
          return;
        }
        const dirNew = keyMap[k];
        if(dirNew){
          // prevent reverse into self if length > 1
          if(snake.length > 1){
            const current = dir;
            if(current.x + dirNew.x === 0 && current.y + dirNew.y === 0){
              // reverse attempted -> ignore
              return;
            }
          }
          nextDir = dirNew;
          // if game not started, start on first move
          if(!running){
            startGame();
          }
        }
      });

      // controls
      function startGame(){
        if(!running){
          running = true;
          paused = false;
          // if no movement direction, set default to right
          if(dir.x === 0 && dir.y === 0 && nextDir.x === 0 && nextDir.y === 0){
            nextDir = {x:1,y:0};
          }
          scheduleTick();
        }
        updateUI();
      }

      function scheduleTick(){
        if(tickId) clearInterval(tickId);
        tickInterval = 1000 / speed;
        tickId = setInterval(tick, tickInterval);
      }

      function togglePause(){
        if(!running) return;
        paused = !paused;
        updateUI();
      }

      startBtn.addEventListener('click', () => {
        startGame();
      });
      pauseBtn.addEventListener('click', () => {
        togglePause();
      });
      resetBtn.addEventListener('click', () => {
        if(tickId) clearInterval(tickId);
        resetGame();
      });

      speedUp.addEventListener('click', () => {
        speed = Math.min(20, speed + 1);
        scheduleTick();
        updateUI();
      });
      speedDown.addEventListener('click', () => {
        speed = Math.max(2, speed - 1);
        scheduleTick();
        updateUI();
      });

      // initialize
      resetGame();
      draw();

      // responsiveness: recalc tile on resize
      function resizeCanvas(){
        // keep canvas square using min of container width
        const cssMax = Math.min(560, Math.max(360, window.innerWidth * 0.5));
        canvas.style.width = cssMax + 'px';
        canvas.style.height = cssMax + 'px';
        // tile remains based on original internal resolution
        tile = Math.floor(canvas.width / COLS);
        draw();
      }
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      // expose for debugging (optional)
      window.__snake = {
        start: startGame,
        reset: resetGame,
        pause: () => { paused=true; updateUI(); },
        resume: () => { paused=false; updateUI(); },
        setSpeed: (s) => { speed = Math.max(2, Math.min(20, s)); scheduleTick(); updateUI(); }
      };
    })();
  </script>
</body>
</html>
